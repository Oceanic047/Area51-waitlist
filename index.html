<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area51 - Unlock the Unknown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000000;
            color: #00ff7f;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas for space background */
        #space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Alien glyphs container */
        .alien-glyphs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .glyph {
            position: absolute;
            font-size: 24px;
            color: rgba(138, 43, 226, 0.4);
            animation: glyphFloat 10s ease-in-out infinite;
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
        }

        @keyframes glyphFloat {
            0%, 100% { 
                transform: translateY(0) rotate(0deg);
                opacity: 0.3;
            }
            50% { 
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.7;
            }
        }

        /* Content container */
        .content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* UFO container */
        #ufo-container {
            height: 250px;
            margin-bottom: 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ufo {
            width: 180px;
            height: 180px;
            position: relative;
            animation: ufoHover 3s ease-in-out infinite;
        }

        @keyframes ufoHover {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .ufo-disc {
            width: 180px;
            height: 40px;
            background: linear-gradient(180deg, #00ff7f 0%, #008f5c 50%, #00ff7f 100%);
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 0 30px rgba(0, 255, 127, 0.8),
                0 0 60px rgba(0, 255, 127, 0.4),
                inset 0 0 20px rgba(0, 255, 127, 0.3);
            animation: ufoRotate 4s linear infinite;
        }

        @keyframes ufoRotate {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        .ufo-dome {
            width: 90px;
            height: 45px;
            background: radial-gradient(circle at 50% 100%, rgba(138, 43, 226, 0.9), rgba(138, 43, 226, 0.4));
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 
                0 0 20px rgba(138, 43, 226, 0.8),
                inset 0 -10px 20px rgba(138, 43, 226, 0.4);
        }

        .ufo-lights {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .ufo-light {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #00ff7f, transparent);
            border-radius: 50%;
            box-shadow: 0 0 15px #00ff7f;
            animation: lightBlink 1s ease-in-out infinite;
        }

        .ufo-light:nth-child(1) { top: 50%; left: 10%; animation-delay: 0s; }
        .ufo-light:nth-child(2) { top: 30%; left: 30%; animation-delay: 0.2s; }
        .ufo-light:nth-child(3) { top: 30%; right: 30%; animation-delay: 0.4s; }
        .ufo-light:nth-child(4) { top: 50%; right: 10%; animation-delay: 0.6s; }
        .ufo-light:nth-child(5) { bottom: 40%; left: 20%; animation-delay: 0.8s; background: radial-gradient(circle, #8a2be2, transparent); box-shadow: 0 0 15px #8a2be2; }
        .ufo-light:nth-child(6) { bottom: 40%; right: 20%; animation-delay: 1s; background: radial-gradient(circle, #8a2be2, transparent); box-shadow: 0 0 15px #8a2be2; }

        @keyframes lightBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .ufo-beam {
            width: 150px;
            height: 200px;
            background: linear-gradient(180deg, rgba(0, 255, 127, 0.3) 0%, rgba(0, 255, 127, 0.05) 100%);
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
            animation: beamPulse 2s ease-in-out infinite;
        }

        @keyframes beamPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 12px;
            background: linear-gradient(90deg, #00ff7f, #8a2be2, #00ff7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 127, 0.8);
        }

        @keyframes logoGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(138, 43, 226, 1));
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(0, 255, 127, 1));
            }
        }

        h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 15px;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(0, 255, 127, 0.8),
                0 0 20px rgba(138, 43, 226, 0.6);
            animation: textPulse 2s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .subheadline {
            font-size: 18px;
            color: #00ff7f;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 0 0 10px rgba(0, 255, 127, 0.5);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8a2be2;
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 80px;
            box-shadow: 
                0 0 20px rgba(138, 43, 226, 0.5),
                inset 0 0 20px rgba(138, 43, 226, 0.1);
            backdrop-filter: blur(10px);
            animation: countdownPulse 2s ease-in-out infinite;
        }

        @keyframes countdownPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 20px rgba(138, 43, 226, 0.5),
                    inset 0 0 20px rgba(138, 43, 226, 0.1);
            }
            50% { 
                box-shadow: 
                    0 0 30px rgba(138, 43, 226, 0.8),
                    inset 0 0 30px rgba(138, 43, 226, 0.2);
            }
        }

        .countdown-number {
            font-size: 32px;
            font-weight: 900;
            color: #00ff7f;
            display: block;
            text-shadow: 0 0 10px rgba(0, 255, 127, 0.8);
        }

        .countdown-label {
            font-size: 11px;
            color: #8a2be2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Holographic console form */
        .holographic-console {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff7f;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 
                0 0 40px rgba(0, 255, 127, 0.4),
                inset 0 0 40px rgba(0, 255, 127, 0.05);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .holographic-console::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(0, 255, 127, 0.05),
                transparent
            );
            animation: holographicScan 3s linear infinite;
        }

        @keyframes holographicScan {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .holographic-console::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 127, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 127, 0.03) 3px
            );
            pointer-events: none;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(0, 255, 127, 0.5);
            border-radius: 8px;
            color: #00ff7f;
            transition: all 0.3s ease;
            box-shadow: 
                inset 0 0 10px rgba(0, 255, 127, 0.1),
                0 0 10px rgba(0, 255, 127, 0.2);
        }

        input:focus {
            outline: none;
            border-color: #00ff7f;
            box-shadow: 
                inset 0 0 15px rgba(0, 255, 127, 0.2),
                0 0 20px rgba(0, 255, 127, 0.5);
            background: rgba(0, 0, 0, 0.9);
        }

        input::placeholder {
            color: rgba(0, 255, 127, 0.4);
        }

        .cta-button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            background: linear-gradient(90deg, #8a2be2, #00ff7f);
            border: 2px solid #00ff7f;
            border-radius: 8px;
            color: #000000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 30px rgba(0, 255, 127, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            animation: buttonPulse 2s ease-in-out infinite;
        }

        @keyframes buttonPulse {
            0%, 100% { 
                box-shadow: 
                    0 0 30px rgba(0, 255, 127, 0.6),
                    inset 0 0 20px rgba(255, 255, 255, 0.1);
            }
            50% { 
                box-shadow: 
                    0 0 50px rgba(0, 255, 127, 0.9),
                    0 0 50px rgba(138, 43, 226, 0.6),
                    inset 0 0 30px rgba(255, 255, 255, 0.2);
            }
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 50px rgba(0, 255, 127, 1),
                0 0 50px rgba(138, 43, 226, 0.8),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 127, 0.2);
            border: 2px solid #00ff7f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #00ff7f;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 0 20px rgba(0, 255, 127, 0.5);
            position: relative;
            z-index: 1;
        }

        .success-message.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            margin-top: 30px;
            font-size: 14px;
            color: #8a2be2;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .logo {
                font-size: 36px;
                letter-spacing: 6px;
            }

            h1 {
                font-size: 28px;
            }

            .subheadline {
                font-size: 16px;
            }

            .container {
                padding: 15px;
            }

            #ufo-container {
                height: 180px;
                margin-bottom: 20px;
            }

            .ufo {
                width: 140px;
                height: 140px;
            }

            .ufo-disc {
                width: 140px;
                height: 32px;
            }

            .ufo-dome {
                width: 70px;
                height: 35px;
                top: -25px;
            }

            .countdown-item {
                min-width: 70px;
                padding: 10px 15px;
            }

            .countdown-number {
                font-size: 24px;
            }

            .holographic-console {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 28px;
                letter-spacing: 4px;
            }

            h1 {
                font-size: 22px;
            }

            #ufo-container {
                height: 150px;
            }

            .ufo {
                width: 120px;
                height: 120px;
            }

            .ufo-disc {
                width: 120px;
                height: 28px;
            }

            .ufo-dome {
                width: 60px;
                height: 30px;
                top: -22px;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                min-width: 60px;
                padding: 8px 12px;
            }

            .countdown-number {
                font-size: 20px;
            }

            .countdown-label {
                font-size: 10px;
            }

            .glyph {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas for space background -->
    <canvas id="space-canvas"></canvas>

    <!-- Alien glyphs -->
    <div class="alien-glyphs" id="alien-glyphs"></div>

    <div class="content">
        <div class="container">
            <!-- UFO -->
            <div id="ufo-container">
                <div class="ufo">
                    <div class="ufo-disc">
                        <div class="ufo-dome"></div>
                        <div class="ufo-lights">
                            <div class="ufo-light"></div>
                            <div class="ufo-light"></div>
                            <div class="ufo-light"></div>
                            <div class="ufo-light"></div>
                            <div class="ufo-light"></div>
                            <div class="ufo-light"></div>
                        </div>
                    </div>
                    <div class="ufo-beam"></div>
                </div>
            </div>

            <div class="logo">AREA51</div>
            <h1>Unlock the Unknown at Area51</h1>
            <p class="subheadline">Join the waitlist and be the first to explore.</p>
            
            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">00</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">00</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="minutes">00</span>
                    <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">00</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>

            <div class="holographic-console">
                <form id="waitlistForm">
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="► ENTER YOUR NAME" 
                            required
                            aria-label="Name"
                        >
                    </div>
                    <div class="form-group">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="► ENTER YOUR EMAIL" 
                            required
                            aria-label="Email"
                        >
                    </div>
                    <button type="submit" class="cta-button">Join the Waitlist</button>
                </form>
                <div class="success-message" id="successMessage">
                    ✓ TRANSMISSION RECEIVED: You're on the waitlist.
                </div>
            </div>

            <p class="footer-text">Coming Soon • The Truth Awaits</p>
        </div>
    </div>

    <script>
        // ========== CANVAS SPACE BACKGROUND ==========
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Stars
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2,
                alpha: Math.random()
            });
        }

        // Planet
        let planetAngle = 0;
        const planet = {
            x: canvas.width * 0.15,
            y: canvas.height * 0.2,
            radius: 80
        };

        function drawSpace() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars with twinkling
            stars.forEach(star => {
                star.alpha += (Math.random() - 0.5) * 0.1;
                star.alpha = Math.max(0.1, Math.min(1, star.alpha));
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });

            // Draw rotating alien planet
            ctx.save();
            ctx.translate(planet.x, planet.y);

            // Planet glow
            const gradient = ctx.createRadialGradient(0, 0, planet.radius * 0.8, 0, 0, planet.radius * 1.3);
            gradient.addColorStop(0, 'rgba(138, 43, 226, 0)');
            gradient.addColorStop(0.7, 'rgba(138, 43, 226, 0.3)');
            gradient.addColorStop(1, 'rgba(138, 43, 226, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius * 1.3, 0, Math.PI * 2);
            ctx.fill();

            // Planet body
            const planetGradient = ctx.createRadialGradient(-20, -20, 20, 0, 0, planet.radius);
            planetGradient.addColorStop(0, 'rgba(138, 43, 226, 1)');
            planetGradient.addColorStop(0.5, 'rgba(74, 14, 120, 1)');
            planetGradient.addColorStop(1, 'rgba(45, 8, 71, 1)');
            ctx.fillStyle = planetGradient;
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Planet surface details (rotating)
            ctx.rotate(planetAngle);
            ctx.strokeStyle = 'rgba(0, 255, 127, 0.3)';
            ctx.lineWidth = 2;
            
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.ellipse(0, 0, planet.radius * 0.8, planet.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.rotate(Math.PI / 5);
            }

            ctx.restore();

            planetAngle += 0.002;

            requestAnimationFrame(drawSpace);
        }

        drawSpace();

        // ========== ALIEN GLYPHS ==========
        function createAlienGlyphs() {
            const glyphsContainer = document.getElementById('alien-glyphs');
            const glyphChars = ['◊', '◈', '◇', '⬡', '⬢', '⬣', '◬', '◭', '◮', '◯', '⟐', '⟡', '⟢', '⟣', '▲', '▼', '◀', '▶'];
            
            // Create glyphs around edges
            for (let i = 0; i < 25; i++) {
                const glyph = document.createElement('div');
                glyph.className = 'glyph';
                glyph.textContent = glyphChars[Math.floor(Math.random() * glyphChars.length)];
                
                // Position randomly around edges
                const edge = Math.floor(Math.random() * 4);
                
                switch(edge) {
                    case 0: // top
                        glyph.style.top = Math.random() * 20 + '%';
                        glyph.style.left = Math.random() * 100 + '%';
                        break;
                    case 1: // right
                        glyph.style.top = Math.random() * 100 + '%';
                        glyph.style.right = Math.random() * 15 + '%';
                        break;
                    case 2: // bottom
                        glyph.style.bottom = Math.random() * 20 + '%';
                        glyph.style.left = Math.random() * 100 + '%';
                        break;
                    case 3: // left
                        glyph.style.top = Math.random() * 100 + '%';
                        glyph.style.left = Math.random() * 15 + '%';
                        break;
                }
                
                glyph.style.animationDelay = Math.random() * 5 + 's';
                glyph.style.animationDuration = (8 + Math.random() * 4) + 's';
                
                glyphsContainer.appendChild(glyph);
            }
        }

        // ========== COUNTDOWN TIMER ==========
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        const countdownInterval = setInterval(updateCountdown, 1000);
        
        // Clear interval when page is hidden
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearInterval(countdownInterval);
            }
        });

        // ========== FORM HANDLING ==========
        document.getElementById('waitlistForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            const waitlistData = {
                name: name,
                email: email,
                timestamp: new Date().toISOString()
            };

            let waitlist = [];
            try {
                waitlist = JSON.parse(localStorage.getItem('area51Waitlist') || '[]');
                if (!Array.isArray(waitlist)) {
                    waitlist = [];
                }
            } catch (e) {
                console.error('Error parsing waitlist data:', e);
                waitlist = [];
            }
            waitlist.push(waitlistData);
            localStorage.setItem('area51Waitlist', JSON.stringify(waitlist));

            document.getElementById('successMessage').classList.add('show');
            
            this.reset();

            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('show');
            }, 5000);
        });

        // ========== INITIALIZATION ==========
        window.addEventListener('DOMContentLoaded', () => {
            createAlienGlyphs();
            updateCountdown();
        });
    </script>
</body>
</html>
