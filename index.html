<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area51 - Unlock the Unknown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 255, 127, 0.1) 0%, transparent 50%);
            animation: backgroundPulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes backgroundPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 600px;
            width: 90%;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #00ff7f, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(138, 43, 226, 0.8)); }
            50% { filter: drop-shadow(0 0 20px rgba(0, 255, 127, 0.8)); }
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(0, 255, 127, 0.5);
        }

        .subheadline {
            font-size: 18px;
            color: #b0b0b0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .countdown-item {
            background: rgba(138, 43, 226, 0.2);
            border: 2px solid #8a2be2;
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 80px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        .countdown-number {
            font-size: 32px;
            font-weight: 900;
            color: #00ff7f;
            display: block;
        }

        .countdown-label {
            font-size: 12px;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-container {
            background: rgba(10, 10, 10, 0.8);
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid rgba(0, 255, 127, 0.3);
            border-radius: 8px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00ff7f;
            box-shadow: 0 0 15px rgba(0, 255, 127, 0.5);
        }

        input::placeholder {
            color: #666;
        }

        .cta-button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(90deg, #8a2be2, #00ff7f);
            border: none;
            border-radius: 8px;
            color: #000000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.5);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.8), 0 0 30px rgba(0, 255, 127, 0.8);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .success-message {
            display: none;
            background: rgba(0, 255, 127, 0.2);
            border: 2px solid #00ff7f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #00ff7f;
            animation: fadeIn 0.5s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .logo {
                font-size: 36px;
                letter-spacing: 4px;
            }

            h1 {
                font-size: 32px;
            }

            .subheadline {
                font-size: 16px;
            }

            .container {
                padding: 20px;
            }

            .countdown-item {
                min-width: 70px;
                padding: 10px 15px;
            }

            .countdown-number {
                font-size: 24px;
            }

            .form-container {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 28px;
            }

            h1 {
                font-size: 24px;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-item {
                min-width: 60px;
                padding: 8px 12px;
            }

            .countdown-number {
                font-size: 20px;
            }

            .countdown-label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AREA51</div>
        <h1>Unlock the Unknown at Area51</h1>
        <p class="subheadline">Join the waitlist and be the first to explore what lies beyond.</p>
        
        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <div class="form-container">
            <form id="waitlistForm">
                <div class="form-group">
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="Enter your name" 
                        required
                        aria-label="Name"
                    >
                </div>
                <div class="form-group">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required
                        aria-label="Email"
                    >
                </div>
                <button type="submit" class="cta-button">Join the Waitlist</button>
            </form>
            <div class="success-message" id="successMessage">
                ✓ Welcome to Area51! You're on the waitlist.
            </div>
        </div>

        <p class="footer-text">Coming Soon • The Truth Awaits</p>
    </div>

    <script>
        // Countdown Timer - Set to 30 days from now
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Update countdown every second
        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
        
        // Clear interval when page is hidden to prevent memory leaks
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearInterval(countdownInterval);
            }
        });

        // Form submission handler
        document.getElementById('waitlistForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            // Store in localStorage (in a real app, you'd send this to a backend)
            const waitlistData = {
                name: name,
                email: email,
                timestamp: new Date().toISOString()
            };

            // Get existing waitlist or create new one
            let waitlist = [];
            try {
                waitlist = JSON.parse(localStorage.getItem('area51Waitlist') || '[]');
                if (!Array.isArray(waitlist)) {
                    waitlist = [];
                }
            } catch (e) {
                console.error('Error parsing waitlist data:', e);
                waitlist = [];
            }
            waitlist.push(waitlistData);
            localStorage.setItem('area51Waitlist', JSON.stringify(waitlist));

            // Show success message
            document.getElementById('successMessage').classList.add('show');
            
            // Reset form
            this.reset();

            // Hide success message after 5 seconds
            setTimeout(() => {
                document.getElementById('successMessage').classList.remove('show');
            }, 5000);
        });
    </script>
</body>
</html>
